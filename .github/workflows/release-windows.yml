# Builds the Windows installer on GitHub's Windows runner and attaches it, with latest.yml for the updater, to the
# release of the pushed tag (v<package.json version>). The Mac build is signed and notarized on the release Mac.
name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # electron-builder publishes each file on its own, and when the release of the tag does not exist yet two of
      # them create it at the same moment: GitHub accepts one and refuses the other (422 already_exists), which ends
      # the build and leaves the installer unpublished. The release is made once here, so every upload finds it.
      - name: Start the release of this tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Morse Desktop $GITHUB_REF_NAME"
      - run: npx electron-builder --config electron-builder.release.cjs --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
