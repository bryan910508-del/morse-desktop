# Builds the Windows installer without publishing anything, so the Windows build is known to work before a release
# tag starts release-windows.yml. It runs when the windows-check branch is pushed (or by hand) and keeps the installer
# as a workflow artifact for a week.
# B379: it also runs the unit tests on Windows, installs the installer silently for this user, starts the installed app
# and checks that its window reads the app's own page, then removes it again. No secret is read: the app starts at its
# sign-in screen with no account.
name: Windows check
on:
  push:
    branches: [windows-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests on Windows
        run: npm run test:unit
      # The steps below still run when the tests fail, so one run shows both; the job then fails.
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Package the installer
        if: ${{ !cancelled() }}
        run: npx electron-builder --config electron-builder.release.cjs --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: morse-windows-setup
          path: dist/Morse-Setup-x64.exe
          retention-days: 7
      # Windows PC check 10-② (B394): the person types with the Microsoft Korean IME. Korean is added to this user's
      # input languages before the app starts, so its window can switch to it.
      - name: Add Korean input
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $languages = Get-WinUserLanguageList
          if (-not ($languages | Where-Object LanguageTag -eq 'ko-KR')) { $languages.Add('ko-KR'); Set-WinUserLanguageList $languages -Force }
          Write-Output "input languages: $((Get-WinUserLanguageList | ForEach-Object { $_.LanguageTag + ' ' + ($_.InputMethodTips -join ',') }) -join '; ')"
      - name: Install silently for this user
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath dist\Morse-Setup-x64.exe -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "installer exit $($setup.ExitCode)" }
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter Morse.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'Morse.exe not found after the silent install' }
          "MORSE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "installed: $($exe.FullName)"
      - name: The installed version is this version
        if: ${{ !cancelled() && env.MORSE_EXE != '' }}
        shell: pwsh
        run: |
          $expected = (node -p "require('./package.json').version").Trim()
          $product = (Get-Item $env:MORSE_EXE).VersionInfo.ProductVersion
          $feed = (Select-String -Path dist\latest.yml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          Write-Output "package $expected, executable $product, latest.yml $feed"
          if (-not $product.StartsWith($expected)) { throw "executable version $product is not $expected" }
          if ($feed -ne $expected) { throw "latest.yml version $feed is not $expected" }
      - name: The installed app starts and reads its own page
        if: ${{ !cancelled() && env.MORSE_EXE != '' }}
        shell: pwsh
        run: |
          # The renderer's debugging port answers in a release build (the fuses close Node's --inspect, not this).
          $app = Start-Process -FilePath $env:MORSE_EXE -ArgumentList '--remote-debugging-port=9222' -PassThru
          $page = $null
          for ($i = 0; $i -lt 60 -and -not $page; $i++) {
            Start-Sleep -Seconds 1
            try { $page = (Invoke-RestMethod -Uri 'http://127.0.0.1:9222/json' -TimeoutSec 2) | Where-Object { $_.type -eq 'page' -and $_.url -like 'morse://app/*' } | Select-Object -First 1 } catch { }
            if ($app.HasExited) { throw "Morse exited with $($app.ExitCode) before its window opened" }
          }
          if (-not $page) { throw 'no morse://app page within 60 seconds' }
          Write-Output "window page: $($page.url) after $i s"
          # One message to the page over its debugging port: an expression, its answer as text.
          $socket = [System.Net.WebSockets.ClientWebSocket]::new()
          $socket.ConnectAsync([Uri]$page.webSocketDebuggerUrl, [Threading.CancellationToken]::None).Wait()
          $script:messageId = 0
          function Invoke-Page([string]$expression) {
            $script:messageId++
            $request = @{ id = $script:messageId; method = 'Runtime.evaluate'; params = @{ expression = $expression; awaitPromise = $true; returnByValue = $true } } | ConvertTo-Json -Compress -Depth 5
            $bytes = [Text.Encoding]::UTF8.GetBytes($request)
            $socket.SendAsync([ArraySegment[byte]]::new($bytes), [System.Net.WebSockets.WebSocketMessageType]::Text, $true, [Threading.CancellationToken]::None).Wait()
            $buffer = New-Object byte[] 65536
            $answer = $socket.ReceiveAsync([ArraySegment[byte]]::new($buffer), [Threading.CancellationToken]::None).Result
            $text = [Text.Encoding]::UTF8.GetString($buffer, 0, $answer.Count)
            try { return (ConvertFrom-Json $text).result.result.value } catch { return $text }
          }
          # Windows PC check 9: what this Windows' Chromium offers a voice message — whether it can record AAC (the format
          # the three apps send) and how many microphones it sees (the runner has none). Written, not judged.
          Write-Output "voice capture: $(Invoke-Page "(async () => JSON.stringify({ aac: typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported('audio/mp4;codecs=mp4a.40.2'), microphones: (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput').length }))()")"
          # Windows PC check 10-② (B394): the left Alt pressed and let go alone, then «abc» — on the person's PC (Korean
          # keyboard, Microsoft Korean IME) nothing was typed and nothing chimed. Real key events (SendInput) go to the
          # window, a text field of the test's own reads what arrived, and the window thread's menu-mode flags are read at
          # once (GetGUIThreadInfo: GUI_INMENUMODE 0x4, GUI_SYSTEMMENUMODE 0x8, GUI_POPUPMENUMODE 0x10) — in US layout,
          # then in the Korean IME's English and Hangul modes.
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class MorseKeys {
            [StructLayout(LayoutKind.Sequential)] struct KEYBDINPUT { public ushort wVk; public ushort wScan; public uint dwFlags; public uint time; public IntPtr dwExtraInfo; }
            [StructLayout(LayoutKind.Sequential)] struct MOUSEINPUT { public int dx; public int dy; public uint mouseData; public uint dwFlags; public uint time; public IntPtr dwExtraInfo; }
            [StructLayout(LayoutKind.Explicit)] struct InputUnion { [FieldOffset(0)] public MOUSEINPUT mi; [FieldOffset(0)] public KEYBDINPUT ki; }
            [StructLayout(LayoutKind.Sequential)] struct INPUT { public uint type; public InputUnion u; }
            [DllImport("user32.dll", SetLastError = true)] static extern uint SendInput(uint count, INPUT[] inputs, int size);
            public static uint Key(ushort key, bool up) { var input = new INPUT { type = 1 }; input.u.ki = new KEYBDINPUT { wVk = key, dwFlags = up ? 2u : 0u }; return SendInput(1, new[] { input }, Marshal.SizeOf(typeof(INPUT))); }
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int left; public int top; public int right; public int bottom; }
            [StructLayout(LayoutKind.Sequential)] public struct GUITHREADINFO { public int cbSize; public uint flags; public IntPtr active; public IntPtr focus; public IntPtr capture; public IntPtr menuOwner; public IntPtr moveSize; public IntPtr caret; public RECT caretRect; }
            [DllImport("user32.dll")] static extern bool GetGUIThreadInfo(uint thread, ref GUITHREADINFO info);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr window, IntPtr process);
            public static uint MenuFlags(IntPtr window) { var info = new GUITHREADINFO(); info.cbSize = Marshal.SizeOf(typeof(GUITHREADINFO)); return GetGUIThreadInfo(GetWindowThreadProcessId(window, IntPtr.Zero), ref info) ? info.flags : 0xFFFFFFFF; }
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr window);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr window);
            [DllImport("user32.dll")] public static extern IntPtr LoadKeyboardLayout(string id, uint flags);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
          }
          '@
          $window = (Get-Process -Name Morse | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1).MainWindowHandle
          function Tap([uint16]$key) { [void][MorseKeys]::Key($key, $false); Start-Sleep -Milliseconds 40; [void][MorseKeys]::Key($key, $true); Start-Sleep -Milliseconds 90 }
          $field = "(() => { let f = document.getElementById('ci-keys'); if (!f) { f = document.createElement('textarea'); f.id = 'ci-keys'; f.style.cssText = 'position:fixed;left:8px;top:8px;width:200px;height:40px;z-index:99999'; document.body.append(f) } f.value = ''; f.focus(); return document.activeElement === f })()"
          $read = "document.getElementById('ci-keys').value"
          function Check([string]$label) {
            [void][MorseKeys]::SetForegroundWindow($window); Start-Sleep -Milliseconds 300
            $focused = Invoke-Page $field; Start-Sleep -Milliseconds 300
            Tap 0x41; Tap 0x42; Tap 0x43; Start-Sleep -Milliseconds 300
            $plain = Invoke-Page $read
            [void](Invoke-Page $field); Start-Sleep -Milliseconds 300
            Tap 0xA4
            $menuAfterAlt = '0x{0:X}' -f [MorseKeys]::MenuFlags($window)
            Tap 0x41; Tap 0x42; Tap 0x43; Start-Sleep -Milliseconds 300
            $menuAfterKeys = '0x{0:X}' -f [MorseKeys]::MenuFlags($window)
            $afterAlt = Invoke-Page $read
            Tap 0x1B; Start-Sleep -Milliseconds 200
            Write-Output "alt check [$label]: focused=$focused plain='$plain' afterAlt='$afterAlt' menuFlags afterAlt=$menuAfterAlt afterKeys=$menuAfterKeys"
          }
          Check 'us'
          # The Korean IME on this window (WM_INPUTLANGCHANGEREQUEST 0x50, KLF_ACTIVATE 1); it starts in one mode and the
          # Hangul key (VK_HANGUL 0x15) turns it to the other — what «abc» became shows which.
          $korean = [MorseKeys]::LoadKeyboardLayout('00000412', 1)
          [void][MorseKeys]::PostMessage($window, 0x50, [IntPtr]::Zero, $korean); Start-Sleep -Milliseconds 800
          Check 'ko-first-mode'
          [void][MorseKeys]::SetForegroundWindow($window); [void](Invoke-Page $field); Tap 0x15; Start-Sleep -Milliseconds 300
          Check 'ko-after-hangul-key'
          # Windows PC 10-14 19:3x (0.241.31): the count shows on the taskbar while the window is minimized, not on the tray
          # icon once the window is closed (hidden to the tray). The tray picture is drawn in the window
          # (app-badge-image.ts: document.fonts.load, then the logo's Image.decode, then canvas.toDataURL). The same three
          # steps run here with the window shown and then hidden (Ctrl+W hides it to the tray, B374), each with a 5 s limit.
          $probe = "(async () => { const t0 = performance.now(), step = (name, work) => Promise.race([work.then(() => name + ':ok'), new Promise(r => setTimeout(() => r(name + ':timeout'), 5000))]); const font = await step('font', document.fonts.load('400 11px Pretendard', '7')); const logo = new Image(); logo.src = '/morse.png'; const decode = await step('decode', logo.decode()); const canvas = document.createElement('canvas'); canvas.width = canvas.height = 32; let png = 'none'; try { canvas.getContext('2d').drawImage(logo, 0, 0, 32, 32); png = canvas.toDataURL('image/png').length } catch (e) { png = e.name } return JSON.stringify({ visibility: document.visibilityState, font, decode, png, ms: Math.round(performance.now() - t0) }) })()"
          Write-Output "badge draw [shown]: $(Invoke-Page $probe)"
          [void][MorseKeys]::SetForegroundWindow($window); Start-Sleep -Milliseconds 300
          [void][MorseKeys]::Key(0x11, $false); Tap 0x57; [void][MorseKeys]::Key(0x11, $true); Start-Sleep -Seconds 2
          Write-Output "after Ctrl+W: window visible=$([MorseKeys]::IsWindowVisible($window)) process alive=$(-not $app.HasExited)"
          Write-Output "badge draw [hidden]: $(Invoke-Page $probe)"
          Start-Sleep -Seconds 5
          Write-Output "badge draw [hidden +5s]: $(Invoke-Page $probe)"
          # Where app.getPath('logs') puts it is written too, since the person is told where to find it.
          Start-Sleep -Seconds 2
          $badgeLogs = @(Get-ChildItem -Path $env:APPDATA, $env:LOCALAPPDATA -Recurse -Filter 'badge-check.log' -ErrorAction SilentlyContinue)
          if (-not $badgeLogs) { Write-Output 'badge-check.log: none under APPDATA or LOCALAPPDATA' }
          foreach ($badgeLog in $badgeLogs) { Write-Output "badge-check.log at $($badgeLog.FullName)"; Get-Content $badgeLog.FullName | ForEach-Object { Write-Output "badge-check.log: $_" } }
          $socket.Dispose()
      # B348d (Windows PC 10-14): the tray picture shows the count but its tooltip stays «Morse». Electron's Windows icon
      # (shell/browser/ui/win/notify_icon.cc, v44.3.0) sends the tip only in SetToolTip (:160-168); SetImage sends the
      # picture alone (:130-140), and on TaskbarCreated ResetIcon deletes and re-adds the icon without a tip (:110-128,
      # notify_icon_host.cc:249-252). Qt (tdesktop) sends picture and tip together every time (qwindowssystemtrayicon.cpp
      # 336-352, 436-444). A notification-area button's Name is its tooltip; it is read here through UI Automation for the
      # installed Morse (hidden to the tray, no account: «Morse») and for a bare Electron icon (scripts/tray-tooltip-probe.cjs)
      # whose tip becomes «Probe (3)» — then after setImage, a TaskbarCreated broadcast, the tip sent again, an Explorer
      # restart and the tip sent once more.
      - name: The tray tooltip through UI Automation
        if: ${{ !cancelled() && env.MORSE_EXE != '' }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class MorseShell {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern uint RegisterWindowMessage(string name);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          }
          '@
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          $shots = Join-Path $env:RUNNER_TEMP 'tray-shots'; New-Item -ItemType Directory -Force -Path $shots | Out-Null
          # The pointer rests on a tray button for 3 s and the bottom of the screen is kept as a picture (the runner's own
          # desktop; there is no account in it).
          function Shot([string]$name, $rect) {
            if ($rect -and -not $rect.IsEmpty) { [void][MorseShell]::SetCursorPos([int]($rect.X + $rect.Width / 2), [int]($rect.Y + $rect.Height / 2)) } else { $rect = $null }
            Start-Sleep -Seconds 3
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $height = [Math]::Min(320, $bounds.Height)
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap); $graphics.CopyFromScreen(0, $bounds.Height - $height, 0, 0, $bitmap.Size)
            $bitmap.Save((Join-Path $shots "$name.png"), [System.Drawing.Imaging.ImageFormat]::Png); $graphics.Dispose(); $bitmap.Dispose()
            Write-Output "shot $name.png at $(if ($rect) { "$([int]$rect.X),$([int]$rect.Y)" } else { 'no button' })"
          }
          # The tray button whose Name is the given text (Windows 11 may put a space before it), the one nearest to where Morse's was.
          function TrayButton([string]$name, $near) {
            $tray = [Windows.Automation.AutomationElement]::RootElement.FindFirst([Windows.Automation.TreeScope]::Children, [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ClassNameProperty, 'Shell_TrayWnd'))
            if (-not $tray) { return $null }
            $found = @($tray.FindAll([Windows.Automation.TreeScope]::Descendants, [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty, [Windows.Automation.ControlType]::Button)) | Where-Object { $_.Current.Name.Trim() -eq $name })
            if (-not $found) { return $null }
            if ($near) { $found = @($found | Sort-Object { [Math]::Abs($_.Current.BoundingRectangle.X - $near.X) }) }
            return $found[0].Current.BoundingRectangle
          }
          Write-Output "system: $((Get-CimInstance Win32_OperatingSystem).Caption) $([Environment]::OSVersion.Version); explorer running=$([bool](Get-Process explorer -ErrorAction SilentlyContinue))"
          # Windows 11 keeps a new icon in the hidden flyout; promoting it (NotifyIconSettings\*\IsPromoted) puts it on the taskbar.
          function Promote { Get-ChildItem 'HKCU:\Control Panel\NotifyIconSettings' -ErrorAction SilentlyContinue | ForEach-Object { $path = (Get-ItemProperty $_.PSPath).ExecutablePath; if ($path -match '(Morse|electron)\.exe$') { Set-ItemProperty $_.PSPath -Name IsPromoted -Value 1 -Type DWord } } }
          function TrayNames([string]$label) {
            Start-Sleep -Seconds 2
            $root = [Windows.Automation.AutomationElement]::RootElement
            $names = @()
            foreach ($class in 'Shell_TrayWnd', 'NotifyIconOverflowWindow', 'TopLevelWindowForOverflowXamlIsland') {
              $shell = $root.FindFirst([Windows.Automation.TreeScope]::Children, [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ClassNameProperty, $class))
              if (-not $shell) { continue }
              $buttons = $shell.FindAll([Windows.Automation.TreeScope]::Descendants, [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty, [Windows.Automation.ControlType]::Button))
              foreach ($button in $buttons) { $name = $button.Current.Name; if ($name -match 'Morse|Probe|Electron|^$') { $names += "${class}:'$name'" } }
              Write-Output "tray [$label] $class buttons=$($buttons.Count)"
            }
            Write-Output "tray [$label]: $($names -join ' | ')"
          }
          Promote; TrayNames 'installed Morse, hidden'
          # B348d fix: the installed Morse loses its tooltip when the taskbar is made again (TaskbarCreated); shown again
          # from a second start (second-instance → showWindow → the window's 'show' → DesktopShell.refresh) it sends the
          # tray picture and tooltip again. The title is the window's own (B348d-3; no account here, so «Morse»).
          $morseRect = TrayButton 'Morse' $null
          Shot 'morse-before' $morseRect
          [void][MorseShell]::PostMessage([IntPtr]0xFFFF, [MorseShell]::RegisterWindowMessage('TaskbarCreated'), [IntPtr]::Zero, [IntPtr]::Zero); TrayNames 'Morse after TaskbarCreated'
          Shot 'morse-after-taskbarcreated' (TrayButton '' $morseRect)
          Start-Process -FilePath $env:MORSE_EXE; Start-Sleep -Seconds 4
          TrayNames 'Morse shown again'
          Write-Output "window title: '$((Get-Process -Name Morse | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1).MainWindowTitle)'"
          Shot 'morse-shown-again' (TrayButton 'Morse' $morseRect)
          # The checkout's Electron binary is fetched here if npm ci left it out (the installer above carries its own).
          if (-not (Test-Path node_modules\electron\dist\electron.exe)) { node node_modules\electron\install.js }
          $electron = (node -p "require('electron')").Trim()
          Write-Output "probe electron: $(Split-Path $electron -Leaf) $(Test-Path $electron)"
          $probe = Start-Process -FilePath $electron -ArgumentList 'scripts\tray-tooltip-probe.cjs' -PassThru
          for ($i = 0; $i -lt 30; $i++) { Start-Sleep -Seconds 1; try { [void](Invoke-RestMethod 'http://127.0.0.1:47900/tip?text=Probe' -TimeoutSec 2); break } catch { } }
          Promote; TrayNames 'probe made'
          [void](Invoke-RestMethod 'http://127.0.0.1:47900/tip?text=Probe%20(3)'); TrayNames 'probe tip set'
          [void](Invoke-RestMethod 'http://127.0.0.1:47900/image'); TrayNames 'probe image set'
          [void][MorseShell]::PostMessage([IntPtr]0xFFFF, [MorseShell]::RegisterWindowMessage('TaskbarCreated'), [IntPtr]::Zero, [IntPtr]::Zero); TrayNames 'after TaskbarCreated'
          [void](Invoke-RestMethod 'http://127.0.0.1:47900/tip?text=Probe%20(3)'); TrayNames 'tip sent again'
          Get-Process explorer -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep -Seconds 5
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe; Start-Sleep -Seconds 5 }
          Promote; TrayNames 'after Explorer restart'
          [void](Invoke-RestMethod 'http://127.0.0.1:47900/tip?text=Probe%20(3)'); TrayNames 'tip sent again after restart'
          try { [void](Invoke-RestMethod 'http://127.0.0.1:47900/quit' -TimeoutSec 3) } catch { }
          if (-not $probe.HasExited) { $probe | Stop-Process -Force }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.MORSE_EXE != '' }}
        with:
          name: tray-shots
          path: ${{ runner.temp }}/tray-shots
          retention-days: 7
      - name: Close and remove the installed app
        if: ${{ always() && env.MORSE_EXE != '' }}
        shell: pwsh
        run: |
          Get-Process -Name Morse -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $uninstaller = Get-ChildItem -Path (Split-Path $env:MORSE_EXE) -Filter 'Uninstall*.exe' | Select-Object -First 1
          if ($uninstaller) { Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait }
          Write-Output 'removed'
